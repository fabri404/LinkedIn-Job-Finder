name: linkedin-job-api CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/linkedin-job-api
  PYTHON_VERSION: "3.11"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Lint
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: pip install flake8==7.0.0 ruff==0.4.4

      - name: Flake8
        run: flake8 apps/ config/ --max-line-length=88

      - name: Ruff lint
        run: ruff check apps/ config/

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Tests (con Chromium para Selenium)
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests (pytest + Chromium)
    runs-on: ubuntu-24.04
    needs: lint

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: linkedin_job_api_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: "ci-testing-secret-key-not-for-production-use"
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: "sqlite:///test_db.sqlite3"
      DB_NAME: linkedin_job_api_test
      DB_USER: test_user
      DB_PASSWORD: test_pass
      DB_HOST: localhost
      DB_PORT: "5432"
      # Credenciales dummy — los tests deben mockear el scraper, no llamar a LinkedIn real
      LINKEDIN_USER: "test@example.com"
      LINKEDIN_PASS: "dummy_test_password_ci"
      GMAIL_USER: "test@example.com"
      GMAIL_APP_PASSWORD: "dummy_app_password_ci"
      CV_PATH: "cv.pdf"
      MIN_KEYWORDS_MATCH: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
          chromium-browser --version
          chromedriver --version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install psycopg2-binary==2.9.9
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --settings=config.settings.development

      - name: Run unit tests with coverage
        run: |
          pytest \
            --cov=apps \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            -v \
            -m "not integration"

      - name: Run integration tests (non-blocking)
        run: pytest -v -m integration --tb=short
        continue-on-error: true

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: linkedin-job-api
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Security scan
  # ─────────────────────────────────────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-24.04
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Bandit — análisis estático de seguridad
        run: |
          pip install bandit==1.7.8
          bandit -r apps/ config/ -ll --format text

      - name: Safety — scan de CVEs en dependencias
        run: |
          pip install safety==3.2.0
          safety check -r requirements.txt --full-report
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4 — Build & Push (solo en push a main)
  # ─────────────────────────────────────────────────────────────────────────────
  build-push:
    name: Build & push image
    runs-on: ubuntu-24.04
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
